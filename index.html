<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3ede4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="共讀書房"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><title>共讀書房 · EPUB 閱讀器</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script><style>
:root{--bg:#f3ede4;--panel:#fffaf2;--fg:#493d33;--muted:#87796c;--accent:#86674f;--line:#dfd3c4}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--fg)}body.night{--bg:#232326;--panel:#303034;--fg:#e9e3db;--muted:#ada69d;--accent:#bfa28a;--line:#48464a}body.green{--bg:#e0eadc;--panel:#edf4e9;--fg:#344b3b;--muted:#65786a;--accent:#5b8068;--line:#c4d5c4}body.oled{--bg:#080808;--panel:#151515;--fg:#e4e4e4;--muted:#aaa;--accent:#c4b4a3;--line:#333}button,input,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{height:100dvh;display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));border-bottom:1px solid var(--line);min-height:55px}.bar .name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}.pill{background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:13px}.modes{display:flex;gap:5px;justify-content:center;padding:8px 10px;border-bottom:1px solid var(--line)}.modes button{flex:1;max-width:160px;padding:10px 5px;border-radius:12px;font-size:13px}.modes button.active{background:var(--accent);color:var(--panel)}.main{flex:1;min-height:0;display:flex;position:relative}.reading{flex:1;min-width:0;display:flex;flex-direction:column}.viewer{flex:1;min-height:0;position:relative}.viewer iframe{border:0}.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;flex-direction:column;gap:14px}.empty h2{margin:0;font-size:24px}.empty p{line-height:1.7;color:var(--muted);max-width:340px}.primary{background:var(--accent);color:var(--panel);padding:12px 17px;border-radius:12px}.controls{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);padding-bottom:max(8px,env(safe-area-inset-bottom))}.controls button{padding:8px 13px;border-radius:10px;background:var(--panel)}.controls .status{flex:1;text-align:center;font-size:12px;color:var(--muted)}.drawer{position:absolute;inset:auto 0 0 0;max-height:67%;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px #0002;z-index:4;overflow:auto;padding:16px 18px max(20px,env(safe-area-inset-bottom))}.drawer[hidden],.chat[hidden],.settings[hidden]{display:none!important}.drawer header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.drawer h3{margin:0}.drawer label{display:block;margin:13px 0 6px;font-size:13px;color:var(--muted)}.drawer input[type=range],.drawer select{width:100%}.drawer select,.drawer input[type=text]{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.small{font-size:12px;color:var(--muted);line-height:1.6}.chat{width:340px;max-width:42%;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}.chat h3{margin:0;padding:14px;border-bottom:1px solid var(--line);font-size:15px}.chatlog{flex:1;overflow:auto;padding:12px;line-height:1.6;font-size:14px}.bubble{padding:10px 12px;border-radius:13px;margin:8px 0;background:var(--bg);white-space:pre-wrap}.chatbottom{padding:12px;border-top:1px solid var(--line)}textarea{resize:vertical;width:100%;min-height:64px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}.tocitem{display:block;width:100%;text-align:left;padding:11px;border-bottom:1px solid var(--line)}.floating{position:absolute;right:16px;bottom:16px;background:var(--accent);color:var(--panel);padding:12px 15px;border-radius:24px;box-shadow:0 3px 12px #0003;z-index:2}.tip{padding:10px 12px;border-radius:10px;background:var(--bg);line-height:1.5;font-size:13px}.note{font-size:13px;color:var(--muted)}@media(max-width:800px){.chat{position:absolute;inset:auto 0 0 0;width:100%;max-width:none;height:min(54dvh,460px);border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;z-index:3;box-shadow:0 -4px 15px #0002}.bar{gap:5px}.pill{padding:8px 9px}}
</style></head><body><div class="app"><div class="bar"><button class="pill" id="library">📚 書庫</button><div class="name" id="title">共讀書房</div><button class="pill" id="toc">☷</button><button class="pill" id="settingsBtn">Aa</button></div><div class="modes"><button data-mode="quiet" class="active">📖 純閱讀</button><button data-mode="companion">💬 AI 陪讀</button><button data-mode="club">☕ 章節讀書會</button></div><div class="main"><div class="reading"><div class="viewer" id="viewer"><div class="empty" id="empty"><h2>歡迎來到共讀書房</h2><p>匯入妳的 EPUB，保留原書字型與排版。iPhone、iPad 直立或橫向都能閱讀。</p><button class="primary" id="importFirst">＋ 匯入 EPUB</button><p class="small">僅支援無 DRM 的 EPUB。書籍儲存在這台裝置的瀏覽器中，不會自動上傳。</p></div></div><div class="controls"><button id="prev">←</button><div class="status" id="status">尚未開啟書籍</div><button id="next">→</button><button id="bookmark">☆</button></div></div><aside class="chat" id="chat" hidden><h3 id="chatTitle">共讀筆記</h3><div class="chatlog" id="chatlog"><div class="tip">這是無 API 版本：可以記下想法、複製目前章節與選取的文字，並帶到 ChatGPT 討論。這裡不會假裝已連上 AI。</div></div><div class="chatbottom"><textarea id="question" placeholder="這男主到底在想什麼？"></textarea><div class="row" style="margin-top:8px"><button class="pill" id="copyPrompt">複製提問</button><button class="primary" id="ask">到 ChatGPT 討論 ↗</button></div></div></aside><button class="floating" id="floatChat" hidden>💬 討論</button></div></div>
<div class="drawer" id="drawer" hidden><header><h3 id="drawerTitle">閱讀設定</h3><button id="closeDrawer">✕</button></header><div id="drawerContent"></div></div><input type="file" id="file" accept=".epub,application/epub+zip" hidden>
<script>
const $=id=>document.getElementById(id),prefKey='coread-prefs-v1',progressKey='coread-positions-v1';let prefs=JSON.parse(localStorage.getItem(prefKey)||'{}'),positions=JSON.parse(localStorage.getItem(progressKey)||'{}'),book=null,rendition=null,bookId='',currentTitle='',currentHref='',mode='quiet',selection='',chapterText='',db=null,chatOpen=false;const savePrefs=()=>localStorage.setItem(prefKey,JSON.stringify(prefs));const savePositions=()=>localStorage.setItem(progressKey,JSON.stringify(positions));
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('coread-books',1);r.onupgradeneeded=()=>r.result.createObjectStore('books',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}function tx(mode='readonly'){return db.transaction('books',mode).objectStore('books')}function allBooks(){return new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function putBook(v){return new Promise((res,rej)=>{let r=tx('readwrite').put(v);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function deleteBook(id){return new Promise((res,rej)=>{let r=tx('readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function showDrawer(title,html){$('drawerTitle').textContent=title;$('drawerContent').innerHTML=html;$('drawer').hidden=false}function closeDrawer(){$('drawer').hidden=true}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyTheme(){document.body.className=prefs.theme||'';if(rendition){const color=(prefs.theme==='night'||prefs.theme==='oled')?'#e9e3db':prefs.theme==='green'?'#344b3b':'#493d33';const bg=prefs.theme==='night'?'#232326':prefs.theme==='oled'?'#080808':prefs.theme==='green'?'#e0eadc':'#f3ede4';rendition.themes.default({'body':{'background':bg+' !important','color':color+' !important'}});if(prefs.font&&prefs.font!=='original')rendition.themes.font(prefs.font==='serif'?'Georgia,serif':prefs.font==='kai'?'BiauKai,serif':'Arial,sans-serif');if(prefs.size)rendition.themes.fontSize(prefs.size+'%');}}function settings(){showDrawer('閱讀外觀',`<label>背景與夜間模式</label><select id="theme"><option value="">奶茶色</option><option value="green">柔和綠</option><option value="night">深灰夜間</option><option value="oled">OLED 純黑</option></select><label>字型（預設保留 EPUB 原書字型）</label><select id="font"><option value="original">保留原書字型</option><option value="serif">明體／襯線字</option><option value="sans">黑體</option><option value="kai">楷體</option></select><label>字體大小：<span id="sizeValue"></span></label><input id="size" type="range" min="75" max="180" step="5"><label>閱讀方式</label><select id="flow"><option value="paginated">左右翻頁</option><option value="scrolled-doc">上下捲動</option></select><p class="small">保留原書字型時，不主動覆蓋字體。調整夜間顏色可能改變原書部分色彩。部分 EPUB 的固定版面或特殊樣式可能不完全支援。</p>`);$('theme').value=prefs.theme||'';$('font').value=prefs.font||'original';$('size').value=prefs.size||100;$('sizeValue').textContent=(prefs.size||100)+'%';$('flow').value=prefs.flow||'paginated';for(const id of ['theme','font','size','flow'])$(id).addEventListener('input',()=>{prefs[id==="theme"?'theme':id]=$ (id).value;if(id==='size')$('sizeValue').textContent=prefs.size+'%';savePrefs();if(id==='flow'&&book){let loc=rendition.currentLocation()?.start?.cfi;renderBook(loc)}else applyTheme()})}
async function renderBook(location){if(!book)return;try{if(rendition)rendition.destroy();$('empty')?.remove();$('viewer').innerHTML='';rendition=book.renderTo('viewer',{width:'100%',height:'100%',flow:prefs.flow||'paginated',spread:'none',allowScriptedContent:false});rendition.on('relocated',loc=>{if(!loc?.start)return;positions[bookId]=loc.start.cfi;savePositions();$('status').textContent=loc.start.displayed?`第 ${loc.start.displayed.page} / ${loc.start.displayed.total} 頁`:'閱讀中';currentHref=loc.start.href||'';updateChapter()});rendition.on('selected',(cfi,contents)=>{try{selection=contents.window.getSelection().toString().slice(0,1800);if(selection&&mode!=='quiet'){openChat();$('question').placeholder='針對選取的原文提問…'}}catch(e){}});await rendition.display(location||positions[bookId]||undefined);applyTheme()}catch(e){alert('無法顯示 EPUB：'+e.message)}}
async function openBook(record){if(typeof ePub==='undefined'){alert('EPUB 引擎未載入。請連上網路後重新整理。');return}try{if(rendition){rendition.destroy();rendition=null}if(book){book.destroy();book=null}bookId=record.id;book=ePub(record.data);await book.ready;currentTitle=book.packaging.metadata.title||record.name;$('title').textContent=currentTitle;await renderBook();closeDrawer()}catch(e){alert('無法開啟此 EPUB。可能是 DRM、格式不支援或檔案損壞。\n'+e.message)}}
async function importFile(file){if(!file)return;if(!/\.epub$/i.test(file.name)){alert('請選擇 EPUB 檔案');return}if(file.size>120*1024*1024&&!confirm('檔案超過 120 MB，可能超出瀏覽器儲存空間。仍要嘗試嗎？'))return;try{const data=await file.arrayBuffer();const id=file.name+'-'+file.size+'-'+file.lastModified;const record={id,name:file.name,data,added:Date.now()};await putBook(record);await openBook(record)}catch(e){alert('匯入失敗，可能是儲存空間不足：'+e.message)}}
async function library(){const items=await allBooks();showDrawer('我的書庫',`<button class="primary" id="addBook">＋ 匯入 EPUB</button><p class="small">書籍只保存在此裝置的網站資料；清除網站資料或移除 App 可能刪除書庫。iPhone 與 iPad 暫不自動同步。</p>${items.length?items.sort((a,b)=>b.added-a.added).map((b,i)=>`<div class="row" style="border-bottom:1px solid var(--line);padding:9px 0"><button class="tocitem" style="flex:4" data-book="${i}">📖 ${esc(b.name)}</button><button class="pill" data-del="${i}" aria-label="刪除">刪除</button></div>`).join(''):'<p>書庫還沒有小說。</p>'}`);$('addBook').onclick=()=>$('file').click();document.querySelectorAll('[data-book]').forEach(el=>el.onclick=()=>openBook(items[+el.dataset.book]));document.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{let b=items[+el.dataset.del];if(confirm('從此裝置刪除「'+b.name+'」？')){await deleteBook(b.id);if(bookId===b.id){location.reload();return}library()}})}
async function toc(){if(!book)return alert('請先匯入 EPUB');let nav=await book.loaded.navigation;let flat=(items,depth=0)=>items.flatMap(x=>[{label:x.label,href:x.href,depth},...flat(x.subitems||[],depth+1)]);let items=flat(nav.toc);showDrawer('章節目錄',items.map((x,i)=>`<button class="tocitem" data-ch="${i}" style="padding-left:${12+x.depth*15}px">${esc(x.label)}</button>`).join('')||'此書沒有章節目錄');document.querySelectorAll('[data-ch]').forEach(el=>el.onclick=async()=>{await rendition.display(items[+el.dataset.ch].href);closeDrawer()})}
async function updateChapter(){if(!book)return;try{const nav=await book.loaded.navigation;const flat=items=>items.flatMap(x=>[x,...flat(x.subitems||[])]);const href=(currentHref||'').split('#')[0];const arr=flat(nav.toc);let entry=arr.filter(x=>href.endsWith(x.href.split('#')[0])||x.href.split('#')[0].endsWith(href)).pop();$('chatTitle').textContent=(mode==='club'?'☕ 章節讀書會 · ':'💬 AI 陪讀 · ')+(entry?.label||currentTitle);chapterText='';}catch(e){}}
function setMode(v){mode=v;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===v));$('floatChat').hidden=v==='quiet'||chatOpen;if(v==='quiet')closeChat();else if(v==='club')openChat();else closeChat();$('chatTitle').textContent=(v==='club'?'☕ 章節讀書會':'💬 AI 陪讀')+' · '+currentTitle}
function openChat(){if(mode==='quiet')return;$('chat').hidden=false;$('floatChat').hidden=true;chatOpen=true}function closeChat(){$('chat').hidden=true;chatOpen=false;$('floatChat').hidden=mode==='quiet'}
function promptText(){return `請當我的韓國小說 AI 共讀夥伴。小說：${currentTitle||'尚未載入'}。閱讀模式：${mode==='club'?'章節讀書會':'即時陪讀'}。目前章節位置：${currentHref||'未知'}。${selection?'我選取的原文：\n「'+selection+'」\n':''}我的問題：${$('question').value||'請分析這段角色心理與情感變化。'}\n請以提供的原文為依據，不要杜撰情節，不要劇透未提供的後續內容。`}
$('ask').onclick=()=>{const p=promptText();navigator.clipboard?.writeText(p).then(()=>{alert('提問已複製，接著開啟 ChatGPT 並貼上即可。');window.open('https://chatgpt.com/','_blank','noopener')}).catch(()=>{window.prompt('複製以下提問後貼到 ChatGPT：',p)})};$('copyPrompt').onclick=async()=>{try{await navigator.clipboard.writeText(promptText());alert('已複製提問')}catch(e){window.prompt('請複製：',promptText())}};
$('library').onclick=library;$('importFirst').onclick=()=>$('file').click();$('file').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};$('toc').onclick=toc;$('settingsBtn').onclick=settings;$('closeDrawer').onclick=closeDrawer;$('prev').onclick=()=>rendition?.prev();$('next').onclick=()=>rendition?.next();$('bookmark').onclick=()=>{if(!book)return;let key='bookmark-'+bookId;let cfi=rendition.currentLocation()?.start?.cfi;let a=JSON.parse(localStorage.getItem(key)||'[]');if(cfi){a.push(cfi);localStorage.setItem(key,JSON.stringify(a));alert('已儲存書籤（目前裝置）')}};$('floatChat').onclick=openChat;document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>setMode(el.dataset.mode));document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input,select'))return;if(e.key==='ArrowRight')rendition?.next();if(e.key==='ArrowLeft')rendition?.prev();if(e.key==='Escape'){closeDrawer();closeChat()}});
(async()=>{applyTheme();try{await openDB();let books=await allBooks();if(books.length)await openBook(books.sort((a,b)=>b.added-a.added)[0])}catch(e){alert('此瀏覽器無法使用本機書庫：'+e.message)}})();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
