<script>
const $=id=>document.getElementById(id),prefKey='coread-prefs-v1',progressKey='coread-positions-v1';let prefs=JSON.parse(localStorage.getItem(prefKey)||'{}'),positions=JSON.parse(localStorage.getItem(progressKey)||'{}'),book=null,rendition=null,bookId='',currentTitle='',currentHref='',mode='quiet',selection='',chapterText='',db=null,chatOpen=false;const savePrefs=()=>localStorage.setItem(prefKey,JSON.stringify(prefs));const savePositions=()=>localStorage.setItem(progressKey,JSON.stringify(positions));
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('coread-books',1);r.onupgradeneeded=()=>r.result.createObjectStore('books',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}function tx(mode='readonly'){return db.transaction('books',mode).objectStore('books')}function allBooks(){return new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function putBook(v){return new Promise((res,rej)=>{let r=tx('readwrite').put(v);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function deleteBook(id){return new Promise((res,rej)=>{let r=tx('readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function showDrawer(title,html){$('drawerTitle').textContent=title;$('drawerContent').innerHTML=html;$('drawer').hidden=false}function closeDrawer(){$('drawer').hidden=true}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyTheme(){

 document.querySelector('.app').classList.toggle('focus',!!prefs.focus);

 if(!rendition)return;
 const color=(prefs.theme==='night'||prefs.theme==='oled')?'#e9e3db':prefs.theme==='green'?'#344b3b':'#493d33';
 const bg=prefs.theme==='night'?'#232326':prefs.theme==='oled'?'#080808':prefs.theme==='green'?'#e0eadc':'#f3ede4';
 const css={body:{'background':bg+' !important','color':color+' !important'}};

function settings(){
 showDrawer('閱讀外觀 · V0.4',`<div class="setting-group"><label>背景與夜間模式</label><select id="theme"><option value="">奶茶色</option><option value="green">柔和綠</option><option value="night">深灰夜間</option><option value="oled">OLED 純黑</option></select><label>字型</label><select id="font"><option value="original">保留原書字型（預設）</option><option value="serif">明體／襯線字</option><option value="sans">黑體</option><option value="kai">楷體</option></select></div><div class="setting-group"><label>字體大小：<span id="sizeValue"></span></label><input id="size" type="range" min="75" max="200" step="5"><label>行距</label><select id="lineHeight"><option value="original">保留原書行距</option><option value="1.5">1.5 倍</option><option value="1.7">1.7 倍</option><option value="1.9">1.9 倍</option><option value="2.1">2.1 倍</option><option value="2.3">2.3 倍</option></select><label>字距：<span id="letterValue"></span></label><input id="letterSpacing" type="range" min="0" max="3" step="0.5"></div><div class="setting-group"><label>閱讀方式</label><select id="flow"><option value="paginated">左右滑動翻頁（也可點按）</option><option value="scrolled-doc">上下滑動連續閱讀</option></select><label>文字區域最大寬度：<span id="widthValue"></span></label><input id="readWidth" type="range" min="480" max="1100" step="20"><label class="checkline"><input type="checkbox" id="focus"> 專注閱讀（隱藏頂部工具列）</label></div><p class="small">原書字型為預設；行距、字距不調整時維持 EPUB 原樣。深色背景會覆蓋部分書籍色彩。iPad 直立和橫向均可使用單欄。左右模式可手指滑動翻頁；上下模式可自然連續捲動。</p>`);
 for(const id of ['theme','font','size','flow','lineHeight','letterSpacing','readWidth']){
 const el=$(id);el.value=prefs[id]??({theme:'',font:'original',size:100,flow:'paginated',lineHeight:'original',letterSpacing:0,readWidth:780}[id]);
 el.addEventListener('input',()=>{prefs[id]=el.value;savePrefs();updateSettingLabels();if(id==='flow'&&book){const loc=rendition?.currentLocation()?.start?.cfi;renderBook(loc)}else applyTheme()});

}
function updateSettingLabels(){$('sizeValue').textContent=(prefs.size||100)+'%';$('letterValue').textContent=(prefs.letterSpacing||0)+' px';$('widthValue').textContent=(prefs.readWidth||780)+' px'}
function toggleFocus(){prefs.focus=!prefs.focus;savePrefs();applyTheme()}

function enableSwipe(contents){

 },{passive:true});

   if(!start||(prefs.flow||'paginated')!=='paginated'||e.changedTouches.length!==1)return;

async function renderBook(location){if(!book)return;try{if(rendition)rendition.destroy();$('empty')?.remove();$('viewer').innerHTML='';rendition=book.renderTo('viewer',{width:'100%',height:'100%',flow:prefs.flow||'paginated',spread:'none',allowScriptedContent:false});rendition.on('rendered',(_section,view)=>{if(view?.contents)enableSwipe(view.contents)});rendition.on('relocated',loc=>{if(!loc?.start)return;positions[bookId]=loc.start.cfi;savePositions();$('status').textContent=loc.start.displayed?`第 ${loc.start.displayed.page} / ${loc.start.displayed.total} 頁`:'閱讀中';currentHref=loc.start.href||'';updateChapter()});rendition.on('selected',(cfi,contents)=>{try{selection=contents.window.getSelection().toString().slice(0,1800);if(selection&&mode!=='quiet'){openChat();$('question').placeholder='針對選取的原文提問…'}}catch(e){}});await rendition.display(location||positions[bookId]||undefined);applyTheme();

async function importFile(file){if(!file)return;if(!/\.epub$/i.test(file.name)){alert('請選擇 EPUB 檔案');return}if(file.size>120*1024*1024&&!confirm('檔案超過 120 MB，可能超出瀏覽器儲存空間。仍要嘗試嗎？'))return;try{const data=await file.arrayBuffer();const id=file.name+'-'+file.size+'-'+file.lastModified;const record={id,name:file.name,data,added:Date.now()};await putBook(record);await openBook(record)}catch(e){alert('匯入失敗，可能是儲存空間不足：'+e.message)}}
async function library(){const items=await allBooks();showDrawer('我的書庫',`<button class="primary" id="addBook">＋ 匯入 EPUB</button><p class="small">書籍只保存在此裝置的網站資料；清除網站資料或移除 App 可能刪除書庫。iPhone 與 iPad 暫不自動同步。</p>${items.length?items.sort((a,b)=>b.added-a.added).map((b,i)=>`<div class="row" style="border-bottom:1px solid var(--line);padding:9px 0"><button class="tocitem" style="flex:4" data-book="${i}">📖 ${esc(b.name)}</button><button class="pill" data-del="${i}" aria-label="刪除">刪除</button></div>`).join(''):'<p>書庫還沒有小說。</p>'}`);$('addBook').onclick=()=>$('file').click();document.querySelectorAll('[data-book]').forEach(el=>el.onclick=()=>openBook(items[+el.dataset.book]));document.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{let b=items[+el.dataset.del];if(confirm('從此裝置刪除「'+b.name+'」？')){await deleteBook(b.id);if(bookId===b.id){location.reload();return}library()}})}

function setMode(v){mode=v;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===v));$('floatChat').hidden=v==='quiet'||chatOpen;if(v==='quiet')closeChat();else if(v==='club')openChat();else closeChat();$('chatTitle').textContent=(v==='club'?'☕ 章節讀書會':'💬 AI 陪讀')+' · '+currentTitle}

function promptText(){return `請當我的韓國小說 AI 共讀夥伴。小說：${currentTitle||'尚未載入'}。閱讀模式：${mode==='club'?'章節讀書會':'即時陪讀'}。目前章節位置：${currentHref||'未知'}。${selection?'我選取的原文：\n「'+selection+'」\n':''}我的問題：${$('question').value||'請分析這段角色心理與情感變化。'}\n請以提供的原文為依據，不要杜撰情節，不要劇透未提供的後續內容。`}
$('ask').onclick=()=>{const p=promptText();navigator.clipboard?.writeText(p).then(()=>{alert('提問已複製，接著開啟 ChatGPT 並貼上即可。');window.open('https://chatgpt.com/','_blank','noopener')}).catch(()=>{window.prompt('複製以下提問後貼到 ChatGPT：',p)})};$('copyPrompt').onclick=async()=>{try{await navigator.clipboard.writeText(promptText());alert('已複製提問')}catch(e){window.prompt('請複製：',promptText())}};
$('library').onclick=library;$('importFirst').onclick=()=>$('file').click();$('file').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};$('toc').onclick=toc;$('settingsBtn').onclick=settings;$('focusBtn').onclick=toggleFocus;$('focusBottom').onclick=toggleFocus;$('closeDrawer').onclick=closeDrawer;$('prev').onclick=()=>rendition?.prev();$('next').onclick=()=>rendition?.next();$('bookmark').onclick=()=>{if(!book)return;let key='bookmark-'+bookId;let cfi=rendition.currentLocation()?.start?.cfi;let a=JSON.parse(localStorage.getItem(key)||'[]');if(cfi){a.push(cfi);localStorage.setItem(key,JSON.stringify(a));alert('已儲存書籤（目前裝置）')}};$('floatChat').onclick=openChat;document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>setMode(el.dataset.mode));document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input,select'))return;if(e.key==='ArrowRight')rendition?.next();if(e.key==='ArrowLeft')rendition?.prev();if(e.key==='Escape'){closeDrawer();closeChat()}});
(async()=>{applyTheme();try{await openDB();let books=await allBooks();if(books.length)await openBook(books.sort((a,b)=>b.added-a.added)[0])}catch(e){alert('此瀏覽器無法使用本機書庫：'+e.message)}})();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
